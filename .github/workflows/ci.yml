name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hpasskit:
    name: HPASSKit (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build & test
        working-directory: ios/HPASSKit
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

  ios-app:
    name: iOS app (xcodebuild, unsigned ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/ESLCollector
        run: xcodegen generate
      - name: Build (Release, unsigned)
        working-directory: ios/ESLCollector
        run: |
          set -o pipefail
          xcodebuild -project ESLCollector.xcodeproj -scheme ESLCollector \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -200
      - name: Check Info.plist permission strings
        working-directory: ios/ESLCollector
        run: |
          APP=build/Build/Products/Release-iphoneos/ESLCollector.app
          test -d "$APP" || { echo "找不到 $APP"; ls build/Build/Products/*; exit 1; }
          plutil -p "$APP/Info.plist"
          for k in NSBluetoothAlwaysUsageDescription NSMotionUsageDescription NSLocationWhenInUseUsageDescription; do
            plutil -extract "$k" raw "$APP/Info.plist" >/dev/null || { echo "缺少 $k"; exit 1; }
          done
      # 未签名 ipa：下载后用 Sideloadly 以免费 Apple ID 签名安装，见 docs/sideload.md
      - name: Package unsigned ipa
        working-directory: ios/ESLCollector
        run: |
          rm -rf Payload ESLCollector-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ESLCollector.app Payload/
          zip -qry ESLCollector-unsigned.ipa Payload
          unzip -l ESLCollector-unsigned.ipa | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: eslcollector-unsigned-ipa
          path: ios/ESLCollector/ESLCollector-unsigned.ipa
          retention-days: 30

  android:
    name: Android collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runner 自带 Android SDK，用 setup-android 反而会卡在许可协议上
      - name: Build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: eslcollector-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tools/tests -v
