name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hpasskit:
    name: HPASSKit (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build & test
        working-directory: ios/HPASSKit
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

  ios-app:
    name: iOS app (xcodebuild, unsigned ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/ESLCollector
        run: xcodegen generate
      - name: Build (Release, unsigned)
        working-directory: ios/ESLCollector
        run: |
          set -o pipefail
          xcodebuild -project ESLCollector.xcodeproj -scheme ESLCollector \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -200
      - name: Check Info.plist permission strings
        working-directory: ios/ESLCollector
        run: |
          APP=build/Build/Products/Release-iphoneos/ESLCollector.app
          test -d "$APP" || { echo "找不到 $APP"; ls build/Build/Products/*; exit 1; }
          plutil -p "$APP/Info.plist"
          for k in NSBluetoothAlwaysUsageDescription NSMotionUsageDescription NSLocationWhenInUseUsageDescription; do
            plutil -extract "$k" raw "$APP/Info.plist" >/dev/null || { echo "缺少 $k"; exit 1; }
          done
      # 未签名 ipa：下载后用 Sideloadly 以免费 Apple ID 签名安装，见 docs/sideload.md
      - name: Package unsigned ipa
        working-directory: ios/ESLCollector
        run: |
          rm -rf Payload ESLCollector-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ESLCollector.app Payload/
          zip -qry ESLCollector-unsigned.ipa Payload
          unzip -l ESLCollector-unsigned.ipa | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: eslcollector-unsigned-ipa
          path: ios/ESLCollector/ESLCollector-unsigned.ipa
          retention-days: 30
      # main 上的构建同时传到云端后台（Cloudflare R2），看板「安装包」里下载
      - name: Upload ipa to backend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: ios/ESLCollector
        env:
          HPASS_URL: ${{ secrets.HPASS_URL }}
          HPASS_TOKEN: ${{ secrets.HPASS_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$HPASS_URL" ] || [ -z "$HPASS_TOKEN" ]; then echo "没配后台，跳过"; exit 0; fi
          NAME="ESLCollector-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}.ipa"
          ENC=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ.get("MSG","").splitlines()[0][:100] if os.environ.get("MSG") else ""))')
          curl -fsS -X PUT --data-binary @ESLCollector-unsigned.ipa \
            -H "Authorization: Bearer $HPASS_TOKEN" -H "User-Agent: hpass-ci" \
            -H "x-build-sha: $GITHUB_SHA" -H "x-build-run: $GITHUB_RUN_ID" -H "x-build-message: $ENC" \
            "${HPASS_URL%/}/api/builds/$NAME"

  android:
    name: Android collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runner 自带 Android SDK，用 setup-android 反而会卡在许可协议上
      - name: Build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: eslcollector-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tools/tests -v

  telemetry:
    name: Telemetry worker (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        working-directory: server/telemetry
        run: |
          node --check src/hub.js
          sed 's#import DASHBOARD from "./dashboard.html";#const DASHBOARD="";#; s#import { Hub } from "./hub.js";#class Hub{}#' src/index.js > /tmp/index.mjs
          node --check /tmp/index.mjs
          python3 -c "import re;s=open('src/dashboard.html').read();open('/tmp/dash.js','w').write(re.search(r'<script>(.*)</script>',s,re.S).group(1))"
          node --check /tmp/dash.js
