name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只跑和改动有关的 job：先用 changes 算出改了哪几块，其余 job 跳过。
# 用 job 级 if 而不是 on.paths：跳过的 job 显示为 skipped，分支保护里设成必需的检查照样算通过。
# 手动运行（workflow_dispatch）或改了本文件时全部都跑。
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      hpasskit: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.hpasskit == 'true' }}
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.ios == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.android == 'true' }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.python == 'true' }}
      telemetry: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.telemetry == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            hpasskit:
              - *ci
              - "ios/HPASSKit/**"
              # VenueAuthoringTests 会调 tools/venue/imdf_convert.py 读回 Swift 导出的 IMDF
              - "tools/venue/**"
            ios:
              - *ci
              - "ios/**"
            android:
              - *ci
              - "android/**"
            python:
              - *ci
              - "tools/**"
            telemetry:
              - *ci
              - "server/telemetry/**"

  hpasskit:
    name: HPASSKit (swift test)
    needs: changes
    if: needs.changes.outputs.hpasskit == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build & test
        working-directory: ios/HPASSKit
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

  ios-app:
    name: iOS app (xcodebuild, unsigned ipa)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/HPASSApp
        run: xcodegen generate
      - name: Build (Release, unsigned)
        working-directory: ios/HPASSApp
        run: |
          set -o pipefail
          xcodebuild -project HPASSApp.xcodeproj -scheme HPASSApp \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -200
      - name: Check Info.plist permission strings
        working-directory: ios/HPASSApp
        run: |
          APP=build/Build/Products/Release-iphoneos/HPASSApp.app
          test -d "$APP" || { echo "找不到 $APP"; ls build/Build/Products/*; exit 1; }
          plutil -p "$APP/Info.plist"
          for k in NSBluetoothAlwaysUsageDescription NSMotionUsageDescription NSLocationWhenInUseUsageDescription; do
            plutil -extract "$k" raw "$APP/Info.plist" >/dev/null || { echo "缺少 $k"; exit 1; }
          done
      # 未签名 ipa：下载后用 Sideloadly 以免费 Apple ID 签名安装，见 docs/sideload.md
      - name: Package unsigned ipa
        working-directory: ios/HPASSApp
        run: |
          rm -rf Payload HPASSApp-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HPASSApp.app Payload/
          zip -qry HPASSApp-unsigned.ipa Payload
          unzip -l HPASSApp-unsigned.ipa | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: hpassapp-unsigned-ipa
          path: ios/HPASSApp/HPASSApp-unsigned.ipa
          retention-days: 30
      # 后台只收签名包（ios-adhoc.yml 上传）；未签名包只留在上面的 artifact 里

  android:
    name: Android collector
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runner 自带 Android SDK，用 setup-android 反而会卡在许可协议上
      - name: Build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hpasscollector-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  python:
    name: Python tools
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tools/tests -v
      # 单独列出来：RoomPlan 扫描 map.json → imdf_export → imdf_convert 读回，可走面积 / 门 / 连接体 / 名称一致
      - name: IMDF 导出往返校验
        run: python -m unittest tools.tests.test_imdf_export -v

  telemetry:
    name: Telemetry worker (syntax)
    needs: changes
    if: needs.changes.outputs.telemetry == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        working-directory: server/telemetry
        run: |
          node --check src/hub.js
          sed 's#import DASHBOARD from "./dashboard.html";#const DASHBOARD="";#; s#import { Hub } from "./hub.js";#class Hub{}#' src/index.js > /tmp/index.mjs
          node --check /tmp/index.mjs
          python3 -c "import re;s=open('src/dashboard.html').read();open('/tmp/dash.js','w').write(re.search(r'<script>(.*)</script>',s,re.S).group(1))"
          node --check /tmp/dash.js
