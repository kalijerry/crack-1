name: HPASSApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HPASSKit:
    path: ../HPASSKit
targets:
  HPASSApp:
    type: application
    platform: iOS
    dependencies:
      - package: HPASSKit
    sources:
      - path: HPASSApp
    info:
      path: HPASSApp/Info.plist
      properties:
        CFBundleDisplayName: 室内定位
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSBluetoothAlwaysUsageDescription: 扫描附近蓝牙标签的信号强度，辅助室内定位
        NSCameraUsageDescription: 建图和定位时用摄像头做视觉里程计，房间扫描后拍门牌识别房间名；画面只在本机处理、不上传
        NSLocationWhenInUseUsageDescription: 读取罗盘航向用于定位标定；房间扫描时在入口记一次 GPS 位置，让扫出的地图带上经纬度（只存在地图文件里）
        NSMotionUsageDescription: 记录加速度、陀螺仪和磁力计数据用于定位标定
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 允许访问局域网内的服务器；不放开任意明文 HTTP，公网服务器请用 HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 从场地服务器下载地图和信号数据
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hpassapp
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
