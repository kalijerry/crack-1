name: Deploy telemetry worker

# 云端后台（server/telemetry，Cloudflare Worker，hpass.gui.ink）自动部署：
# main 上 server/telemetry 有改动时自动部署，也可以手动跑（Actions → Deploy telemetry worker → Run workflow）。
#
# 需要 Actions 密钥（仓库密钥或环境 cloudflare 里的都行）：
#   CLOUDFLARE（或 CLOUDFLARE_API_TOKEN）  Cloudflare 后台 My Profile → API Tokens，用「Edit Cloudflare Workers」模板建
#                          （要能改 Workers、R2、Durable Objects，和 gui.ink 这个 zone 的 Workers Routes）
#   CLOUDFLARE_ACCOUNT_ID  可选；令牌只对应一个账号时可以不填
#   MAP_BUILD_TOKEN        可选；GitHub 细粒度令牌（只选本仓库，权限 Actions: Read and write），
#                          部署时写成 Worker secret GH_TOKEN，「重建地图」按钮和建图采集上传后自动重建靠它触发 map-build.yml
# 后台口令 TOKEN 是 Worker 自己的 secret，部署不会改它。

on:
  push:
    branches: [main]
    paths: ["server/telemetry/**", ".github/workflows/deploy-telemetry.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-telemetry
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/telemetry/package-lock.json
      - name: Check configuration
        env:
          CF: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "::error::缺 Actions 密钥 CLOUDFLARE（Settings → Secrets and variables → Actions）"
            exit 1
          fi
      - name: Install
        working-directory: server/telemetry
        run: npm ci
      - name: Deploy
        working-directory: server/telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: GitHub token for rebuild button
        working-directory: server/telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAP_BUILD_TOKEN: ${{ secrets.MAP_BUILD_TOKEN }}
        run: |
          # 「重建地图」按钮和建图采集上传后自动重建要用：Worker 拿它触发 map-build.yml
          if [ -z "$MAP_BUILD_TOKEN" ]; then
            echo "::warning::没有 Actions 密钥 MAP_BUILD_TOKEN：重建按钮和自动重建不可用（见 server/telemetry/README.md）"
          else
            printf '%s' "$MAP_BUILD_TOKEN" | npx wrangler secret put GH_TOKEN
          fi
      - name: Smoke test
        run: |
          # 用 workers.dev 地址：hpass.gui.ink 这个 zone 对 GitHub 机房的 IP 返回 403（Cloudflare 防机器人），测不出部署好坏
          code=$(curl -s -o /dev/null -w "%{http_code}" https://hpass-telemetry.kalijerry.workers.dev/)
          echo "https://hpass-telemetry.kalijerry.workers.dev/ → $code"
          [ "$code" = "200" ] || { echo "::error::部署后看板打不开（$code）"; exit 1; }
