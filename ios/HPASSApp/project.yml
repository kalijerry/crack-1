name: HPASSApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # CI（ios-adhoc.yml）打包时写入：构建时间（UTC ISO 8601）和提交号；本机编译时为空，App 里显示「本机编译」
    HPASS_BUILD_DATE: ""
    HPASS_COMMIT: ""
packages:
  HPASSKit:
    path: ../HPASSKit
targets:
  HPASSApp:
    type: application
    platform: iOS
    dependencies:
      - package: HPASSKit
    sources:
      - path: HPASSApp
    info:
      path: HPASSApp/Info.plist
      properties:
        CFBundleDisplayName: 室内定位
        # 不写的话 xcodegen 默认填死 1.0 / 1，App 里永远显示 1.0
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HPASSBuildDate: $(HPASS_BUILD_DATE)
        HPASSCommit: $(HPASS_COMMIT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSBluetoothAlwaysUsageDescription: 扫描附近蓝牙标签的信号强度辅助室内定位；双机测试时两台手机用蓝牙交换配对编号
        NSCameraUsageDescription: 建图时用摄像头做视觉里程计、房间扫描后拍门牌识别房间名；定位默认不用摄像头，只有打开「视觉增强」且手机竖着拿时才用来认房间。画面只在本机处理、不上传
        NSLocationWhenInUseUsageDescription: 让室内定位在锁屏或手机放进口袋后继续运行（只请求最低精度、不读取经纬度，结束定位即停止）；读取罗盘航向用于定位标定；房间扫描时在入口记一次 GPS 位置，让扫出的地图带上经纬度（只存在地图文件里）
        # 锁屏 / 放口袋后继续定位：定位期间开一个最低精度的系统定位保活，CoreMotion 才会继续送数据（见 BackgroundKeeper.swift）
        UIBackgroundModes: [location]
        NSMotionUsageDescription: 记录加速度、陀螺仪和磁力计数据用于定位标定
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 允许访问局域网内的服务器；不放开任意明文 HTTP，公网服务器请用 HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 从场地服务器下载地图和信号数据
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hpassapp
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
