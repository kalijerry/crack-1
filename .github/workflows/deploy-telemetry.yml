name: Deploy telemetry worker

# 云端后台（server/telemetry，Cloudflare Worker，hpass.gui.ink）自动部署：
# main 上 server/telemetry 有改动时自动部署，也可以手动跑（Actions → Deploy telemetry worker → Run workflow）。
#
# 需要仓库密钥：
#   CLOUDFLARE_API_TOKEN   Cloudflare 后台 My Profile → API Tokens，用「Edit Cloudflare Workers」模板建
#                          （要能改 Workers、R2、Durable Objects，和 gui.ink 这个 zone 的 Workers Routes）
#   CLOUDFLARE_ACCOUNT_ID  可选；令牌只对应一个账号时可以不填
# 后台口令 TOKEN 是 Worker 自己的 secret，部署不会改它。

on:
  push:
    branches: [main]
    paths: ["server/telemetry/**", ".github/workflows/deploy-telemetry.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-telemetry
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/telemetry/package-lock.json
      - name: Check configuration
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "::error::缺仓库密钥 CLOUDFLARE_API_TOKEN（Settings → Secrets and variables → Actions）"
            exit 1
          fi
      - name: Install
        working-directory: server/telemetry
        run: npm ci
      - name: Deploy
        working-directory: server/telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://hpass.gui.ink/)
          echo "https://hpass.gui.ink/ → $code"
          [ "$code" = "200" ] || { echo "::error::部署后看板打不开（$code）"; exit 1; }
