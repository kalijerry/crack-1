name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hpasskit:
    name: HPASSKit (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build & test
        working-directory: ios/HPASSKit
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

  ios-app:
    name: iOS app (xcodebuild, unsigned ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/HPASSApp
        run: xcodegen generate
      - name: Build (Release, unsigned)
        working-directory: ios/HPASSApp
        run: |
          set -o pipefail
          xcodebuild -project HPASSApp.xcodeproj -scheme HPASSApp \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -200
      - name: Check Info.plist permission strings
        working-directory: ios/HPASSApp
        run: |
          APP=build/Build/Products/Release-iphoneos/HPASSApp.app
          test -d "$APP" || { echo "找不到 $APP"; ls build/Build/Products/*; exit 1; }
          plutil -p "$APP/Info.plist"
          for k in NSBluetoothAlwaysUsageDescription NSMotionUsageDescription NSLocationWhenInUseUsageDescription; do
            plutil -extract "$k" raw "$APP/Info.plist" >/dev/null || { echo "缺少 $k"; exit 1; }
          done
      # 未签名 ipa：下载后用 Sideloadly 以免费 Apple ID 签名安装，见 docs/sideload.md
      - name: Package unsigned ipa
        working-directory: ios/HPASSApp
        run: |
          rm -rf Payload HPASSApp-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HPASSApp.app Payload/
          zip -qry HPASSApp-unsigned.ipa Payload
          unzip -l HPASSApp-unsigned.ipa | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: hpassapp-unsigned-ipa
          path: ios/HPASSApp/HPASSApp-unsigned.ipa
          retention-days: 30
      # main 上的构建同时传到云端后台（Cloudflare R2），看板「安装包」里下载
      - name: Upload ipa to backend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: ios/HPASSApp
        env:
          HPASS_URL: ${{ secrets.HPASS_URL }}
          HPASS_TOKEN: ${{ secrets.HPASS_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$HPASS_URL" ] || [ -z "$HPASS_TOKEN" ]; then echo "没配后台，跳过"; exit 0; fi
          NAME="HPASSApp-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}.ipa"
          ENC=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ.get("MSG","").splitlines()[0][:100] if os.environ.get("MSG") else ""))')
          curl -fsS -X PUT --data-binary @HPASSApp-unsigned.ipa \
            -H "Authorization: Bearer $HPASS_TOKEN" -H "User-Agent: hpass-ci" \
            -H "x-build-sha: $GITHUB_SHA" -H "x-build-run: $GITHUB_RUN_ID" -H "x-build-message: $ENC" \
            "${HPASS_URL%/}/api/builds/$NAME"

  # 模拟器截图：用演示数据（-uiDemo）启动各个页面截图，作为 artifact 上传，方便评审界面效果。
  # 不读真实传感器、不连网；失败不影响 ios-app / hpasskit 的结论。
  ios-screenshots:
    name: iOS screenshots (simulator)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/HPASSApp
        run: xcodegen generate
      - name: Build for simulator
        working-directory: ios/HPASSApp
        run: |
          set -o pipefail
          xcodebuild -project HPASSApp.xcodeproj -scheme HPASSApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -60
      - name: Take screenshots
        working-directory: ios/HPASSApp
        run: |
          set -x
          APP=build/Build/Products/Debug-iphonesimulator/HPASSApp.app
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for rt, xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          pref = [x for x in phones if x["name"] in ("iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro")]
          print((pref or phones)[0]["udid"])')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant all "$BID" || true
          mkdir -p shots
          shot() {   # 文件名 外观 参数…
            local name=$1 look=$2; shift 2
            xcrun simctl ui "$UDID" appearance "$look"
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" -uiDemo "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 01-navigate-route light -uiTab navigate -uiDemoState navigating
          shot 02-navigate-tracking light -uiTab navigate -uiDemoState tracking
          shot 03-navigate-searching light -uiTab navigate -uiDemoState searching
          shot 04-navigate-idle light -uiTab navigate -uiDemoState idle
          shot 05-navigate-nomap light -uiTab navigate -uiDemoState nomap
          shot 06-mapping-running light -uiTab mapping
          shot 07-library light -uiTab library
          shot 08-settings light -uiTab settings
          shot 11-navigate-route-dark dark -uiTab navigate -uiDemoState navigating
          shot 12-mapping-running-dark dark -uiTab mapping
          shot 13-library-dark dark -uiTab library
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios/HPASSApp/shots
          retention-days: 30

  android:
    name: Android collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runner 自带 Android SDK，用 setup-android 反而会卡在许可协议上
      - name: Build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hpasscollector-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tools/tests -v
      # 单独列出来：RoomPlan 扫描 map.json → imdf_export → imdf_convert 读回，可走面积 / 门 / 连接体 / 名称一致
      - name: IMDF 导出往返校验
        run: python -m unittest tools.tests.test_imdf_export -v

  telemetry:
    name: Telemetry worker (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        working-directory: server/telemetry
        run: |
          node --check src/hub.js
          sed 's#import DASHBOARD from "./dashboard.html";#const DASHBOARD="";#; s#import { Hub } from "./hub.js";#class Hub{}#' src/index.js > /tmp/index.mjs
          node --check /tmp/index.mjs
          python3 -c "import re;s=open('src/dashboard.html').read();open('/tmp/dash.js','w').write(re.search(r'<script>(.*)</script>',s,re.S).group(1))"
          node --check /tmp/dash.js
