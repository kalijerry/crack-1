name: Cloud map build

# 云端融合建图：把后台所有采集会话按地图融合成磁场图 + 蓝牙指纹，上传地图包和报告。
# 只手动触发：GitHub 网页 Actions → Cloud map build → Run workflow，或 gh workflow run map-build.yml。
# 会话数据只在 runner 的临时目录里，不进仓库、不存 artifact。

on:
  workflow_dispatch:
    inputs:
      map_id:
        description: "只处理这张地图（留空 = 全部）"
        required: false
      force:
        description: "会话没变也重建"
        type: boolean
        default: false
      dry_run:
        description: "只算不上传（检查用）"
        type: boolean
        default: false

concurrency:
  group: map-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ios/HPASSKit/.build
          key: hpass-build-${{ runner.os }}-${{ hashFiles('ios/HPASSKit/Package.swift', 'ios/HPASSKit/Sources/**') }}
          restore-keys: hpass-build-${{ runner.os }}-
      - name: Build hpass-build
        working-directory: ios/HPASSKit
        run: swift build -c release --product hpass-build
      - name: Fuse and upload
        env:
          HPASS_URL: ${{ secrets.HPASS_URL }}
          HPASS_TOKEN: ${{ secrets.HPASS_TOKEN }}
          HPASS_BUILD: ios/HPASSKit/.build/release/hpass-build
          MAP_ID: ${{ github.event.inputs.map_id }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python3 tools/cloud_build.py
